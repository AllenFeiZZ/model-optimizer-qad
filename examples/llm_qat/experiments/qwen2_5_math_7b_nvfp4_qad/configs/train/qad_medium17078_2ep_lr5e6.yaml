# Medium-scale full-vocabulary forward-KL QAD run. This deliberately restarts
# from the original fake-quant model rather than either failed QAD checkpoint.
model_name_or_path: ${QAD_FAKEQUANT_MODEL}
output_dir: ${QAD_OUTPUT_DIR}
attn_implementation: flash_attention_2

distill: true
teacher_model: ${QAD_TEACHER_MODEL}
criterion: logits_loss
temperature: 1.0

dataset_config: ${QAD_RESOLVED_DATASET_CONFIG}
train_samples: 16566
eval_samples: 512

num_train_epochs: 2.0
learning_rate: 5.0e-6
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
model_max_length: 2048
warmup_ratio: 0.05
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
use_liger_kernel: false
manual_gc: true
seed: 42
do_train: true
do_eval: true

# FSDP2 already performs activation checkpointing.
gradient_checkpointing: false

# Evaluate frequently, but write only two full FSDP-resumable candidates
# (around steps 2000 and 4000) to stay within the available local disk.
# Trainer restores the lower validation-KL candidate before the final save.
eval_on_start: true
eval_strategy: steps
eval_steps: 500
save_strategy: steps
save_steps: 2000
save_only_model: false
save_total_limit: 1
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

logging_steps: 10
report_to:
  - tensorboard
