# One-epoch, large-data full-vocabulary forward-KL QAD run.
model_name_or_path: ${QAD_FAKEQUANT_MODEL}
output_dir: ${QAD_OUTPUT_DIR}
attn_implementation: flash_attention_2

distill: true
teacher_model: ${QAD_TEACHER_MODEL}
criterion: logits_loss
temperature: 1.0

dataset_config: ${QAD_RESOLVED_DATASET_CONFIG}
train_samples: 3891
eval_samples: 128

num_train_epochs: 1.0
learning_rate: 1.0e-6
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
model_max_length: 2048
warmup_ratio: 0.05
lr_scheduler_type: cosine
use_liger_kernel: false
manual_gc: true
seed: 42
do_train: true
do_eval: true

# FSDP2 already performs activation checkpointing.
gradient_checkpointing: false
# Save only the final consolidated model; full optimizer checkpoints are about
# 43 GB for this model and are unnecessary for this controlled one-epoch run.
save_strategy: 'no'
eval_on_start: true
eval_strategy: steps
eval_steps: 100
logging_steps: 5
report_to:
  - tensorboard
