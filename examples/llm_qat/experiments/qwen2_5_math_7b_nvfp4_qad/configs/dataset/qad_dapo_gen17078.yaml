# One BF16-teacher response for each shuffled DAPO-Math prompt at indices
# 320..17397. Indices 256..319 remain the fixed external holdout.
blend_size: 17078
splits:
  train: 0.97
  eval: 0.03

sources:
  - hf_path: json
    split: train
    ratio: 1
    dataset_kwargs:
      # Resolved by run_qad.sh before ModelOpt loads this blend config.
      data_files: ${QAD_DATA_FILE}
    apply_chat_template: true
    train_only_assistant_tokens: true
    chat_key: messages
    category: dapo_math_bf16_generated_medium
