# Large-data QAD blend generated by the frozen BF16 step199 teacher.
# The source file contains shuffled DAPO-Math indices 320..4415. The fixed
# external holdout uses indices 256..319 and is therefore strictly disjoint.
blend_size: 4096
splits:
  train: 0.95
  eval: 0.05

sources:
  - hf_path: json
    split: train
    ratio: 1
    dataset_kwargs:
      # Resolved by run_qad.sh before ModelOpt loads this blend config.
      data_files: ${QAD_DATA_FILE}
    apply_chat_template: true
    train_only_assistant_tokens: true
    chat_key: messages
    category: dapo_math_bf16_generated_large
